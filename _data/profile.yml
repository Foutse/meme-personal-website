# Bio (Markdown allowed). TO CONFIRM WITH PROF. MOMO.
bio:
  en: >-
    I am an Associate Professor (Maître de Conférences) of Physics at the Université des Montagnes in
    Bangangté, Cameroon, where I have taught physics and biomedical engineering since 2005.
    My research focuses on **low-cost medical devices** for hospitals in low-income settings (neonatal
    incubators, a mobile dental unit, a phonocardiograph, bioimpedance systems) and on **radiation
    protection** in hospitals. I also work on the **nonlinear dynamics** of semiconductor lasers and
    electronic circuits, the subject of my Ph.D. at the University of Dschang. I have supervised
    24 Master's theses and coordinated several of the university's biomedical engineering programmes.
  fr: >-
    Je suis Maître de Conférences en Physique à l'Université des Montagnes à Bangangté (Cameroun), où
    j'enseigne la physique et le génie biomédical depuis 2005. Mes recherches portent sur les
    **dispositifs médicaux à bas coût** pour les hôpitaux des pays à faibles revenus (incubateurs
    néonatals, unité dentaire mobile, phonocardiographe, systèmes de bioimpédance) et sur la
    **radioprotection** en milieu hospitalier. Je travaille aussi sur la **dynamique non linéaire**
    des lasers à semi-conducteurs et des circuits électroniques, sujet de mon doctorat à l'Université
    de Dschang. J'ai encadré 24 mémoires de Master et coordonné plusieurs programmes de génie
    biomédical de l'université.

