# Bio (Markdown allowed). Follows the profile paragraph of his CV.
bio:
  en: >-
    I am Associate Professor (Maître de Conférences) of Physics at the Université des Montagnes in
    Bangangté, Cameroon, where I am also Academic Secretary of the Faculty of Science and Technology
    and a member of BEEMo.Lab (Biomedical Engineering, Energy & Modeling Laboratory).


    My background is in physics: my Ph.D. at the University of Dschang was on the **nonlinear dynamics**
    of semiconductor lasers and electronic circuits, which I continue to study. My research also covers
    **radiation protection** in hospitals and **affordable medical devices for African hospitals**.
    Working in interdisciplinary teams with engineers and Master's students, I take these devices from
    the mathematical model to a working prototype: neonatal incubators, a mobile dental unit,
    a telemedicine phonocardiograph and a bioimpedance system.


    In more than 20 years of university teaching, I have coordinated five degree programmes and
    supervised 24 Master's theses, most of them built around a working device.
  fr: >-
    Je suis Maître de Conférences en physique à l'Université des Montagnes à Bangangté (Cameroun),
    où je suis aussi Secrétaire académique de la Faculté des Sciences et Technologies et membre du
    BEEMo.Lab (Biomedical Engineering, Energy & Modeling Laboratory).


    Physicien de formation, j'ai consacré mon doctorat à l'Université de Dschang à la **dynamique non
    linéaire** des lasers à semi-conducteurs et des circuits électroniques, que je continue d'étudier.
    Mes recherches portent aussi sur la **radioprotection** en milieu hospitalier et sur des
    **dispositifs médicaux abordables pour les hôpitaux d'Afrique**. Au sein d'équipes
    pluridisciplinaires, avec des ingénieurs et des étudiants de master, je conduis ces dispositifs
    du modèle mathématique au prototype fonctionnel : incubateurs néonatals, unité dentaire mobile,
    phonocardiographe pour la télémédecine, système de bioimpédance.


    En plus de vingt ans d'enseignement universitaire, j'ai coordonné cinq formations et encadré
    24 mémoires de master, la plupart autour d'un dispositif fonctionnel.

