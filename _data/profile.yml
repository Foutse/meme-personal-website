# Prospective students. TO CONFIRM WITH PROF. MOMO.
students:
  en: >-
    I supervise Master's projects in biomedical instrumentation, medical device design, radiation
    protection and hospital engineering, most of them built around a working prototype.
    If you are interested in a project, email me with a short CV and the topic you would like to work on.
  fr: >-
    J'encadre des mémoires de Master en instrumentation biomédicale, conception de dispositifs
    médicaux, radioprotection et ingénierie hospitalière, le plus souvent autour d'un prototype
    fonctionnel. Si un projet vous intéresse, écrivez-moi en joignant un court CV et le sujet
    qui vous intéresse.
