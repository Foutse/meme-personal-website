"10.1016/b978-0-12-821184-7.00016-5":
  abstract: "An absolute memristor Van der Pol–Duffing circuit is proposed and analyzed in this paper. The proposed circuit is described by a four-dimensional autonomous system with a line equilibrium point. The stability of the line equilibrium point of this system is analyzed. With a suitable choice of the parameters, the proposed circuit can exhibit extreme multistability features, periodic attractors and hidden chaotic attractors. By introducing two additional parameters in the system describing the proposed circuit, it is possible to either partially or totally control the amplitude of its signals. The physical existence of the dynamical behaviors found in the absolute memristor autonomous Van der Pol–Duffing circuit is assessed using PSIM software. Good qualitative agreement is shown between the numerical simulations and the PSIM results."
