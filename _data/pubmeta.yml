"10.69882/adba.chf.2025013":
  abstract: "This paper is interested in the study of the dynamics and control of the permanent magnet synchronous motor with load torque (PMSMLT). PMSMLT has three fixed points where one is saddle and the two others are saddle focus. PMSMLT exhibits no oscillations, periodic characteristics, chaotic characteristics and coexistence between no oscillations and chaotic characteristics. In order to validate the results obtained numerically, an electronic implementation of PMSMLT is performed in probe simulation program with integrated circuit emphases (PSPICE) environment which reveals a concordance between the numerical simulations and the experimental verifications. The coexisting characteristics is eliminated by the linear augmentation control method."
