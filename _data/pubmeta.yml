"10.1016/j.ijleo.2015.12.110":
  abstract: "An electronic analog circuit of the edge-emitting semiconductor laser is proposed. It is powered with a sine wave, triangular wave and square wave. The numerical results are compared to the experimental one and an agreement is found. By using one parameter controlling the normalized reverse bias of the injection current, the Bifurcation diagram obtained when the electronic system is powered with the triangular wave shows that the system exhibits a period-doubling to chaos and this bifurcation diagram appears to be a shift compare to the one obtained with the sinusoidal wave."
